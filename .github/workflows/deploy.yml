# Publishes the site to GitHub Pages on every push to main (for example, when a new video is uploaded).
# Repository setting required once: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deployment at a time; a newer push waits instead of cancelling a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
      pages: read # configure-pages reads the site's Pages address (origin and base path)
    steps:
      - name: Check out (full history, for "newest first")
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Read the Pages address
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Restore prepared videos
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .media-cache
          key: media-${{ hashFiles('work/**', 'site/**', 'scripts/media/**') }}
          restore-keys: media-

      - name: Install dependencies
        run: npm ci

      - name: Check which videos need preparing
        id: media
        run: node scripts/media/build.ts --plan

      - name: Install ffmpeg (only when a video is new or changed)
        if: steps.media.outputs.needs-ffmpeg == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install Chromium (only when a link preview is new or changed)
        if: steps.media.outputs.needs-browser == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write # deploy-pages publishes the uploaded site
      id-token: write # deploy-pages proves to Pages that this workflow made the artifact (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
