<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="fonts.css" />
    <style>
      html,
      body {
        width: 100vw;
        height: 100vh;
      }
      body {
        display: grid;
      }
      /* The header's mark, "mk" and the orange point, in paper on ink: it reads on light and dark tab
         bars alike, and Latin letters stay legible at favicon size. */
      .tile {
        --mk: 62vw;
        display: grid;
        place-content: center;
        border-radius: 22.5vw;
        background: var(--ink);
      }
      .mk {
        color: var(--paper);
        font-family: var(--display);
        font-size: var(--mk);
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.07em;
        text-box: trim-both cap alphabetic;
        translate: -2% 0;
      }
      .mk b {
        color: var(--accent);
        font-weight: 600;
      }
      /* Android crops maskable icons to any shape: full bleed, with the mark inside the central circle. */
      body.maskable .tile {
        --mk: 46vw;
        border-radius: 0;
      }
      /* iOS rounds home-screen icons itself and turns transparency black: full bleed. */
      body.square .tile {
        border-radius: 0;
      }
    </style>
  </head>
  <body>
    <div class="tile"><div class="mk">mk<b>·</b></div></div>
    <script>
      const variant = location.search.slice(1);
      if (variant) document.body.classList.add(variant);
    </script>
  </body>
</html>
