<!doctype html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="fonts.css" />
    <style>
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
      }
      /* The home page's hero: his name in the display face, his portrait in black and white on orange. */
      .words {
        position: absolute;
        top: 64px;
        left: 64px;
        width: 620px;
      }
      .role {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: var(--display);
        font-size: 24px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .role i {
        width: 12px;
        height: 12px;
        background: var(--accent);
      }
      .name {
        margin-top: 26px;
        font-family: var(--display);
        font-size: 158px;
        font-weight: 600;
        line-height: 0.9;
        letter-spacing: -0.02em;
      }
      .name span {
        display: block;
        padding-left: 70px;
      }
      .name b {
        color: var(--accent);
      }
      .ar {
        margin-top: 34px;
        direction: rtl;
        text-align: left;
        font-size: 40px;
        font-weight: 700;
      }
      .ar small {
        color: var(--muted);
        font-size: 28px;
        font-weight: 500;
      }
      .block {
        position: absolute;
        top: 70px;
        right: 64px;
        bottom: 46px;
        width: 400px;
        background: var(--accent);
      }
      .portrait {
        position: absolute;
        right: 40px;
        bottom: 0;
        height: 590px;
        filter: grayscale(1);
      }
      .rule {
        position: absolute;
        left: 64px;
        right: 520px;
        bottom: 46px;
        border-top: 2px solid var(--line);
      }
    </style>
  </head>
  <body>
    <div class="block"></div>
    <img class="portrait" src="../../portrait.png" alt="" />
    <div class="rule"></div>
    <div class="words">
      <p class="role"><i></i>Video editor &amp; videographer · Giza</p>
      <p class="name" lang="en">Mahmoud<span>Khaled<b>.</b></span></p>
      <p class="ar">محمود خالد <small>· مونتير ومصوّر فيديو</small></p>
    </div>
  </body>
</html>
