<!doctype html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="fonts.css" />
    <style>
      body {
        padding: 6px;
        display: inline-block;
      }
      /* Stacked so it fits the side margin of a link preview without covering the video frame. */
      #mark {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        padding: 12px 16px 12px 12px;
        background: rgba(27, 28, 23, 0.86);
      }
      .ar {
        padding: 0 14px 6px;
        background: var(--accent);
        color: var(--on-accent);
        font-size: 32px;
        font-weight: 800;
        line-height: 1.4;
      }
      .en {
        padding-inline-start: 4px;
        color: var(--paper);
        font-family: var(--display);
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="mark"><span class="ar" lang="ar" dir="rtl">محمود خالد</span><span class="en" lang="en">Mahmoud Khaled</span></div>
  </body>
</html>
