<!doctype html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="fonts.css" />
    <style>
      body {
        padding: 6px;
        display: inline-block;
      }
      /* Stacked so it fits the side margin of a link preview without covering the video frame. */
      #mark {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        padding: 12px 16px 12px 12px;
        border-radius: 22px;
        background: rgba(0, 0, 0, 0.84);
      }
      /* His name in the gold pill, in the page's language only: Arabic, or ?en for the English pages. */
      .pill {
        padding: 0 14px 6px;
        border-radius: 999px;
        background: var(--caption);
        color: var(--screen);
        font-size: 32px;
        font-weight: 900;
        line-height: 1.4;
      }
      .pill[lang='en'] {
        padding: 2px 16px 6px;
      }
    </style>
  </head>
  <body>
    <div id="mark"><span class="pill" lang="ar" dir="rtl">محمود خالد</span></div>
    <script>
      if (location.search === '?en') {
        document.getElementById('mark').innerHTML = '<span class="pill" lang="en">Mahmoud Khaled</span>';
      }
    </script>
  </body>
</html>
