description: "ريل تعليمي لكوتش كاليسثنكس عن الأساسيات اللي لازم تتقنها قبل الـ Muscle-up. كتابة متحركة عربي وإنجليزي ماشية مع الكلام، لقطات توضيحية جوه الكادر، وتلوين أحمر غامق."
description_en: "An educational reel for a calisthenics coach on what to master before a muscle-up. Arabic and English kinetic captions that follow the speech, picture-in-picture demos and a deep red grade."
